name: Validation of cicd_example
on: [push]

jobs:
  run-all:
    runs-on: windows-latest
    name: Run MSBuild
    
    steps:
      - uses: actions/checkout@v4  # Lädt den Code aus dem Repository
      - name: Setup dotnet
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '6.0.x'
          
      - name: Build
        run: dotnet build
        working-directory: .\CI-CD-Test\CIDC_Test\CIDC_Test.sln # Pfad zu deinem .sln oder .csproj
      
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cicdtest  # Artifact-Name
          path: .\CI-CD-Test\CIDC_Test\CIDC_Test\bin\Debug\CIDC_Test.exe  # Genau definierter Pfad zur .exe-Datei
